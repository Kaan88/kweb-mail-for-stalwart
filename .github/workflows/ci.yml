name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2

      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace

  android:
    needs: core
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,x86_64-linux-android

      - uses: Swatinem/rust-cache@v2

      - run: cargo install cargo-ndk --locked

      # Preinstalled NDK on GitHub-hosted runners; exported for later steps.
      - run: echo "ANDROID_NDK_HOME=$ANDROID_NDK_LATEST_HOME" >> "$GITHUB_ENV"

      - uses: gradle/actions/setup-gradle@v4

      - run: chmod +x gradlew
        working-directory: android

      - run: ./gradlew assembleDebug
        working-directory: android

      - run: ./gradlew testDebugUnitTest lintDebug
        working-directory: android

      # The Kotlin side finds this function by its symbol name; a typo would only show on a phone.
      - name: Check the TLS init symbol is exported
        run: |
          nm="$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-nm"
          libs=$(find android/app/build -name libkweb_core.so -path '*arm64-v8a*' | head -1)
          test -n "$libs"
          "$nm" -D --defined-only "$libs" | grep -w Java_ovh_kweb_mail_Tls_init

      - uses: actions/upload-artifact@v4
        with:
          name: kweb-mail-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
