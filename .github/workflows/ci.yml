name: CI

on:
  push:
    branches: [main]
    # A release tag starts the F-Droid jobs (not the -fdroid pre-release tag, which comes after them).
    tags: ["v*", "!v*-fdroid"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core:
    # The commit of a release tag was already checked on main.
    if: github.ref_type != 'tag'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2

      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace

  android:
    needs: core
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,x86_64-linux-android

      - uses: Swatinem/rust-cache@v2

      - run: cargo install cargo-ndk --locked --version 4.1.2

      # The NDK the release is built with (ndkVersion in android/app/build.gradle.kts); exported for later steps.
      - run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;28.2.13676358" > /dev/null
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/28.2.13676358" >> "$GITHUB_ENV"

      - uses: gradle/actions/setup-gradle@v6

      - run: chmod +x gradlew
        working-directory: android

      - run: ./gradlew assembleDebug
        working-directory: android

      - run: ./gradlew testGithubDebugUnitTest lintGithubDebug
        working-directory: android

      - name: Build the release APK
        run: |
          if [ -n "$KWEB_KEYSTORE_BASE64" ] && [ -n "$KWEB_KEYSTORE_PROPERTIES_TEXT" ]; then
            d="$RUNNER_TEMP/kweb-release"; mkdir -p "$d"
            echo "$KWEB_KEYSTORE_BASE64" | base64 -d > "$d/kweb-release.jks"
            echo "$KWEB_KEYSTORE_PROPERTIES_TEXT" | grep -v '^storeFile=' > "$d/keystore.properties"
            echo "storeFile=$d/kweb-release.jks" >> "$d/keystore.properties"
            export KWEB_KEYSTORE_PROPERTIES="$d/keystore.properties"
          fi
          ./gradlew assembleRelease
        working-directory: android
        env:
          KWEB_KEYSTORE_BASE64: ${{ secrets.KWEB_KEYSTORE_BASE64 }}
          KWEB_KEYSTORE_PROPERTIES_TEXT: ${{ secrets.KWEB_KEYSTORE_PROPERTIES }}

      # The Kotlin side finds this function by its symbol name; a typo would only show on a phone.
      - name: Check the TLS init symbol is exported
        run: |
          nm="$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-nm"
          libs=$(find android/app/build -name libkweb_core.so -path '*arm64-v8a*' | head -1)
          test -n "$libs"
          "$nm" -D --defined-only "$libs" | grep -w Java_ovh_kweb_mail_Tls_init

      - uses: actions/upload-artifact@v7
        with:
          name: kweb-mail-debug-apk
          path: android/app/build/outputs/apk/github/debug/*.apk

      - uses: actions/upload-artifact@v7
        with:
          name: kweb-mail-release-apk
          path: android/app/build/outputs/apk/*/release/*.apk

  # On a release tag, or by hand: builds the F-Droid APK twice, in two different folders, and fails if the two differ.
  # The APK it uploads is what F-Droid's own build has to equal.
  reproducible:
    if: github.event_name == 'workflow_dispatch' || github.ref_type == 'tag'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          path: one

      - uses: actions/checkout@v7
        with:
          path: two/deeper/copy

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,x86_64-linux-android

      - run: cargo install cargo-ndk --locked --version 4.1.2

      - run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;28.2.13676358" > /dev/null
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/28.2.13676358" >> "$GITHUB_ENV"

      - name: Build in the first folder
        run: chmod +x gradlew && ./gradlew --no-daemon assembleFdroidRelease
        working-directory: one/android

      # A different folder and a different Java: neither may change the result.
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Build in the second folder
        run: chmod +x gradlew && ./gradlew --no-daemon assembleFdroidRelease
        working-directory: two/deeper/copy/android

      - name: Compare
        run: |
          a=$(ls one/android/app/build/outputs/apk/fdroid/release/*.apk)
          b=$(ls two/deeper/copy/android/app/build/outputs/apk/fdroid/release/*.apk)
          sha256sum "$a" "$b"
          if ! cmp -s "$a" "$b"; then
            mkdir da db && (cd da && unzip -q "../$a") && (cd db && unzip -q "../$b")
            diff -rq da db || true
            exit 1
          fi

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: kweb-mail-fdroid-apk
          path: one/android/app/build/outputs/apk/fdroid/release/*.apk

  # On a release tag, or by hand: F-Droid's own build tool on the recipe in dev/fdroid, at this commit.
  fdroid:
    if: github.event_name == 'workflow_dispatch' || github.ref_type == 'tag'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - run: pip install fdroidserver

      - run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;28.2.13676358" > /dev/null

      - name: Build with fdroid
        run: |
          mkdir -p fd/metadata
          # This commit in place of the release tag, and no comparison with a published APK.
          # The version comes from the Gradle file, so the recipe here needs no change per release.
          code=$(grep '^val appVersionCode' android/app/build.gradle.kts | tr -dc '0-9')
          name=$(grep '^val appVersionName' android/app/build.gradle.kts | cut -d'"' -f2)
          sed -e "s/commit: v.*/commit: $GITHUB_SHA/" -e '/^Binaries:/d' -e '/^AllowedAPKSigningKeys:/d' -e "s/versionName: .*/versionName: $name/" -e "s/versionCode: .*/versionCode: $code/" -e "s/^CurrentVersion: .*/CurrentVersion: $name/" -e "s/^CurrentVersionCode: .*/CurrentVersionCode: $code/" dev/fdroid/ovh.kweb.mail.yml > fd/metadata/ovh.kweb.mail.yml
          cd fd
          echo "sdk_path: $ANDROID_HOME" > config.yml
          # F-Droid's server brings its own Gradle launcher; here the project's wrapper stands in for it.
          { echo '#!/bin/sh'; echo 'exec '"$GITHUB_WORKSPACE"'/android/gradlew "$@"'; } > "$RUNNER_TEMP/gradle-shim"
          chmod +x "$RUNNER_TEMP/gradle-shim" "$GITHUB_WORKSPACE/android/gradlew"
          echo "gradle: $RUNNER_TEMP/gradle-shim" >> config.yml
          chmod 600 config.yml
          # The tool expects to run inside a git repository that holds the recipe, as fdroiddata is.
          git init -q . && git add metadata && git -c user.name=ci -c user.email=ci@invalid commit -q -m recipe
          # Without the runner's own Rust on the PATH: the recipe has to bring it, as on F-Droid's server.
          fd=$(command -v fdroid)
          PATH=$(echo "$PATH" | sed -e 's#[^:]*/[.]cargo/bin:##g') "$fd" build --verbose --test "ovh.kweb.mail:$code"
          # The tool reports a failed build without failing itself.
          test -n "$(find . -name '*.apk')"
          find . -name '*.apk' -exec sha256sum {} +

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: kweb-mail-fdroid-tool-apk
          path: fd/**/*.apk

  # Fails unless F-Droid's tool built exactly the APK the reproducible job built (the one to sign and publish).
  fdroid-match:
    needs: [reproducible, fdroid]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v7
        with:
          name: kweb-mail-fdroid-apk
          path: ours
      - uses: actions/download-artifact@v7
        with:
          name: kweb-mail-fdroid-tool-apk
          path: tool
      - name: Compare
        run: |
          # The tool's output may hold the Gradle output and its own copy; one of them must be ours byte for byte.
          a=$(find ours -name '*.apk')
          test "$(echo "$a" | wc -l)" = 1
          want=$(sha256sum "$a" | cut -d' ' -f1)
          find ours tool -name '*.apk' -exec sha256sum {} +
          find tool -name '*.apk' -exec sha256sum {} + | grep -q "^$want "
