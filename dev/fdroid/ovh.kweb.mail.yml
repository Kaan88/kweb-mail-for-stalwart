# Draft of the build recipe for the fdroiddata repository (metadata/ovh.kweb.mail.yml).
# The text of the store entry comes from fastlane/metadata/android/en-US/ in this repository.
Categories:
  - Internet
License: MIT
SourceCode: https://github.com/Kaan88/kweb-mail-for-stalwart
IssueTracker: https://github.com/Kaan88/kweb-mail-for-stalwart/issues
Changelog: https://github.com/Kaan88/kweb-mail-for-stalwart/blob/HEAD/CHANGELOG.md

AntiFeatures:
  NonFreeNet:
    en-US: The optional "Push through Google" mode and the optional AI assistant use services the user chooses.

# One signature for both stores: F-Droid builds the "fdroid" flavor itself and ships the project's APK below
# only if the two are identical. The APK is attached to a pre-release of its own (tag vX.Y.Z-fdroid) and not
# to the normal release: the app's updater takes the first .apk of the latest release and skips pre-releases.
Binaries: https://github.com/Kaan88/kweb-mail-for-stalwart/releases/download/v%v-fdroid/kweb-mail-fdroid-%v.apk
AllowedAPKSigningKeys: ae7cf160c0a15299e11d891ce08054ae4fc0d749040c2c77536672eec7b2376a

RepoType: git
Repo: https://github.com/Kaan88/kweb-mail-for-stalwart.git

Builds:
  # Placeholder: the first release that contains the "fdroid" flavor (0.2.3 and older cannot be built this way).
  - versionName: 0.2.4
    versionCode: 7
    commit: v0.2.4
    subdir: android/app
    sudo:
      - apt-get update
      - apt-get install -y curl build-essential
    # The product flavor "fdroid" (assembleFdroidRelease): no updater, no REQUEST_INSTALL_PACKAGES.
    gradle:
      - fdroid
    # Rust goes into the home folder; the Gradle build looks for cargo there when it is not on the PATH.
    build:
      - curl -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal --default-toolchain 1.99.1
        --target aarch64-linux-android --target x86_64-linux-android
      - $HOME/.cargo/bin/cargo install cargo-ndk --locked --version 4.1.2
    ndk: 28.2.13676358

AutoUpdateMode: Version v%v
UpdateCheckMode: Tags ^v[0-9.]+$
CurrentVersion: 0.2.4
CurrentVersionCode: 7
