[package]
name = "kweb-core"
description = "kweb mail for Stalwart: sync, cache and notification rules"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lib]
name = "kweb_core"
crate-type = ["lib", "cdylib"]

[[bin]]
name = "uniffi-bindgen"
path = "src/bin/uniffi-bindgen.rs"
required-features = ["bindgen"]

[features]
bindgen = ["uniffi/cli"]

[dependencies]
uniffi = "0.32"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
url = "2"
sha2 = "0.10"
sha1 = "0.10"
base64 = "0.22"
getrandom = "0.3"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "net", "io-util"] }
futures-util = "0.3"
reqwest = { version = "0.13", default-features = false, features = ["rustls", "http2", "stream"] }
jmap-client = "0.4"
rusqlite = { version = "0.42", features = ["bundled"] }
chrono = { version = "0.4", default-features = false, features = ["std"] }
chrono-tz = "0.10"

# Must be the versions the HTTP stack itself uses (see Cargo.lock): the verifier keeps its
# JVM handle in a global, and a second copy of the crate would have its own, empty one.
[target.'cfg(target_os = "android")'.dependencies]
jni = "0.22"
rustls-platform-verifier = "0.7"

[dev-dependencies]
tokio = { version = "1", features = ["full"] }
axum = "0.8"
tempfile = "3"
