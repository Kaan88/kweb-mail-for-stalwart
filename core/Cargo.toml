[package]
name = "kweb-core"
description = "kweb mail for Stalwart: sync, cache and notification rules"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lib]
name = "kweb_core"
crate-type = ["lib", "cdylib"]

[[bin]]
name = "uniffi-bindgen"
path = "src/bin/uniffi-bindgen.rs"
required-features = ["bindgen"]

[features]
bindgen = ["uniffi/cli"]

[dependencies]
uniffi = "0.32"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
url = "2"
sha2 = "0.10"
sha1 = "0.10"
base64 = "0.23"
getrandom = "0.3"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "net", "io-util"] }
futures-util = "0.3"
reqwest = { version = "0.13", default-features = false, features = ["rustls", "http2", "stream"] }
jmap-client = "0.4"
rusqlite = { version = "0.42", features = ["bundled"] }
chrono = { version = "0.4", default-features = false, features = ["std"] }
chrono-tz = "0.10"
# RFC 8291 (Web Push message encryption) for push through Google.
p256 = { version = "0.13", default-features = false, features = ["ecdh", "arithmetic", "ecdsa"] }
hkdf = "0.12"
aes-gcm = "0.10"
# M9: OpenPGP and S/MIME, pure Rust. rPGP without bzip2 (a C library); CMS/X.509 from RustCrypto.
pgp = { version = "0.21.1", default-features = false }
cms = { version = "0.2.3", features = ["std"] }
x509-cert = "0.2.5"
der = { version = "0.7", features = ["std", "oid"] }
rsa = "0.9.10"
p384 = { version = "0.13", default-features = false, features = ["ecdsa"] }
aes = "0.8"
cbc = { version = "0.1", features = ["alloc"] }
p12-keystore = { version = "0.4.1", default-features = false }
mail-parser = { version = "1.0.1", default-features = false }
zeroize = "1"

# Must be the versions the HTTP stack itself uses (see Cargo.lock): the verifier keeps its
# JVM handle in a global, and a second copy of the crate would have its own, empty one.
[target.'cfg(target_os = "android")'.dependencies]
jni = "0.22"
rustls-platform-verifier = "0.7"

[dev-dependencies]
tokio = { version = "1", features = ["full"] }
axum = "0.8"
tempfile = "3"
