org.gradle.jvmargs=-Xmx2g -Dfile.encoding=UTF-8
org.gradle.caching=true
org.gradle.parallel=true
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official
# true (or -PskipNative) skips the Rust/cargo-ndk step. The Kotlin bindings are then generated
# from a host build of the core and no .so files are packaged, so the APK cannot run.
skipNative=false
